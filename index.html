<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NABH Onboarding</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="masthead">
    <a class="title" href="index.html" id="brandTitle">NABH Onboarding</a>
    <div class="cells">
      <span class="cell"><span class="crumbs" id="crumb">Welcome</span></span>
      <span class="cell hidden" id="progressCell"></span>
      <button type="button" class="cell hidden" id="logoutBtn">Log out</button>
    </div>
  </header>

  <div class="page">

    <!-- ===================== Login ===================== -->
    <main id="login" class="login hidden">
      <h1>Read, test, <em>unlock.</em></h1>
      <p class="intro">Log in with your username and PIN. Each module opens after you pass the test for the one before it.</p>

      <section class="card blue-200">
        <div class="card-top label"><span>Log in</span><span>Staff</span></div>
        <div id="message" class="message hidden" role="alert" aria-live="assertive"></div>
        <form id="loginForm" autocomplete="on">
          <label class="field label" for="name">Username</label>
          <input type="text" id="name" name="name" autocomplete="username" required>
          <label class="field label" for="pin">PIN</label>
          <input type="password" id="pin" name="pin" inputmode="numeric" autocomplete="current-password" required>
          <button type="submit" class="btn full" id="loginBtn">Log in</button>
        </form>
      </section>
    </main>

    <!-- ===================== Dashboard ===================== -->
    <main id="dashboard" class="hidden">
      <section class="welcome">
        <h1>Hi <em id="greetName">there.</em></h1>
        <p id="subheading">NABH Onboarding</p>
      </section>

      <section class="bento" aria-label="Your progress">
        <div class="card blue-200">
          <div class="card-top label"><span>Progress</span><span id="progressPct"></span></div>
          <div>
            <p class="big-num"><span id="doneNum">0</span> <small>of <span id="totalNum">14</span></small></p>
            <p class="small" id="summary" style="margin:6px 0 12px"></p>
            <div class="segments" id="segments" role="progressbar" aria-valuemin="0"></div>
          </div>
        </div>
        <div class="card blue-50">
          <div class="card-top label"><span>Pass mark</span><span>Every test</span></div>
          <p class="big-num" id="passNum">85%</p>
        </div>
        <div class="card ink wide">
          <div class="card-top label"><span>Next up</span><span id="nextMeta"></span></div>
          <p class="next-text" id="nextText"></p>
          <a class="btn on-blue hidden" id="nextBtn" href="#">Continue</a>
        </div>
      </section>

      <p class="visually-hidden" id="drawerNote" role="status" aria-live="polite"></p>
      <div id="groups"></div>
    </main>

    <p id="loading" class="loading">Loading...</p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var pad = function (n) { return (n < 10 ? "0" : "") + n; };

      // ---------- Login ----------
      function showLogin() {
        $("loading").classList.add("hidden");
        $("dashboard").classList.add("hidden");
        $("logoutBtn").classList.add("hidden");
        $("progressCell").classList.add("hidden");
        $("crumb").textContent = "Welcome";
        $("login").classList.remove("hidden");
        if (App.param("expired")) App.showMessage("Your session has ended. Please log in again.");
        $("name").focus();
      }

      $("loginForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        App.showMessage("");
        var btn = $("loginBtn");
        btn.disabled = true;
        btn.textContent = "Logging in...";
        var res = await Api.call("login", { name: $("name").value.trim(), pin: $("pin").value.trim() });
        btn.disabled = false;
        btn.textContent = "Log in";
        if (!res.ok) { App.showMessage(res.error, true); $("pin").select(); return; }
        Api.saveSession(res.token, res.name);
        $("pin").value = "";
        history.replaceState(null, "", "index.html");
        showDashboard();
      });

      $("logoutBtn").addEventListener("click", function () {
        Api.clearSession();
        window.location.replace("index.html");
      });

      // ---------- Dashboard ----------
      async function showDashboard() {
        $("login").classList.add("hidden");
        $("loading").classList.remove("hidden");

        var results = await Promise.all([App.loadManifest(), Api.call("getProgress")]);
        var manifest = results[0];
        var res = results[1];
        if (!res.ok) { $("loading").textContent = res.error; return; }

        var name = res.name || Api.getName();
        var items = App.moduleStatuses(manifest.modules, res.progress);
        var done = items.filter(function (i) { return i.status === "completed"; }).length;
        var total = items.length;
        var passPct = (res.settings && res.settings.passPercent) || 85;

        document.title = manifest.programTitle;
        $("brandTitle").textContent = manifest.programTitle;
        $("crumb").textContent = "Dashboard";
        $("greetName").textContent = name + ".";
        $("subheading").textContent = "Read each module, pass its test, and the next one opens.";
        $("doneNum").textContent = done;
        $("totalNum").textContent = total;
        $("summary").textContent = done + " of " + total + " modules completed";
        $("progressPct").textContent = Math.round((done / total) * 100) + "%";
        $("passNum").textContent = passPct + "%";
        $("progressCell").textContent = pad(done) + " / " + pad(total);

        // Segmented progress bar, one segment per module
        var seg = $("segments");
        seg.innerHTML = items.map(function (i) { return "<span class='seg" + (i.status === "completed" ? " done" : "") + "'></span>"; }).join("");
        seg.setAttribute("aria-valuemax", total);
        seg.setAttribute("aria-valuenow", done);
        seg.setAttribute("aria-label", done + " of " + total + " modules completed");

        // "Next up": the module she should work on now
        var next = items.find(function (i) { return i.status === "open" || i.status === "testReady"; });
        if (next) {
          var started = App.getReadState(next.module.id).maxSeen >= 0;
          $("nextMeta").textContent = "Module " + pad(next.module.id);
          $("nextText").textContent = next.module.title;
          $("nextBtn").textContent = next.status === "testReady" ? "Take the test" : (started ? "Continue reading" : "Start reading");
          $("nextBtn").href = linkFor(next);
          $("nextBtn").classList.remove("hidden");
        } else {
          $("nextMeta").textContent = "";
          $("nextText").textContent = done === total ? "All modules completed." : "New modules are coming soon.";
          $("nextBtn").classList.add("hidden");
        }

        renderGroups(items);

        $("loading").classList.add("hidden");
        $("dashboard").classList.remove("hidden");
        $("logoutBtn").classList.remove("hidden");
        $("progressCell").classList.remove("hidden");
      }

      function linkFor(item) {
        if (item.status === "testReady") return "test.html?id=" + item.module.id;
        if (item.status === "completed" || item.status === "open") return "module.html?id=" + item.module.id;
        return null;
      }

      // Module cards, grouped by "part" from modules.json.
      function renderGroups(items) {
        var wrap = $("groups");
        wrap.innerHTML = "";
        var parts = [];
        items.forEach(function (i) {
          var p = i.module.part || "Modules";
          if (parts.indexOf(p) === -1) parts.push(p);
        });

        parts.forEach(function (part, pi) {
          var inPart = items.filter(function (i) { return (i.module.part || "Modules") === part; });
          var head = document.createElement("div");
          head.className = "group-head";
          head.innerHTML = "<h2>" + App.escapeHtml(part) + "</h2><span class='label muted'>Part " + (pi + 1) + " / " +
            pad(inPart[0].module.id) + "-" + pad(inPart[inPart.length - 1].module.id) + "</span>";
          var grid = document.createElement("div");
          grid.className = "grid";
          inPart.forEach(function (item) { grid.appendChild(card(item)); });
          wrap.appendChild(head);
          wrap.appendChild(grid);
        });
      }

      function card(item) {
        var mod = item.module;
        var badge, meta, reason = "";
        switch (item.status) {
          case "completed": badge = "Completed"; meta = "Best score " + App.escapeHtml(item.progress.bestScorePct) + "%"; break;
          case "testReady": badge = "Test ready"; meta = "Reading done"; break;
          case "open":
            var started = App.getReadState(mod.id).maxSeen >= 0;
            badge = started ? "Continue" : "Start"; meta = "Open now"; break;
          case "locked":
            badge = "<span class='lock' aria-hidden='true'></span>Locked"; meta = "Pass Module " + (mod.id - 1) + " first";
            reason = "Module " + mod.id + " is locked. Pass Module " + (mod.id - 1) + " to unlock it.";
            break;
          default:
            badge = "Soon"; meta = "Coming soon";
            reason = "Module " + mod.id + " has not been published yet.";
        }
        var el = document.createElement("button");
        el.type = "button";
        el.className = "mod s-" + item.status;
        el.innerHTML =
          "<span class='art' aria-hidden='true'><span class='num'>" + pad(mod.id) + "</span><span class='badge'>" + badge + "</span></span>" +
          "<span class='caption'><span class='name'>" + App.escapeHtml(mod.title) + "</span><span class='meta label'>" + meta + "</span></span>";
        el.setAttribute("aria-label", "Module " + mod.id + ": " + mod.title + ". " + el.querySelector(".badge").textContent + ". " + meta + ".");
        el.addEventListener("click", function () {
          var href = linkFor(item);
          if (href) { window.location.href = href; return; }
          // Locked or coming soon: nothing opens, just say why on the card.
          el.querySelector(".meta").textContent = reason;
          $("drawerNote").textContent = reason;
        });
        return el;
      }

      // ---------- Start ----------
      if (Api.getToken()) showDashboard(); else showLogin();
    })();
  </script>
</body>
</html>
