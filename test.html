<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test</title>
  <link rel="stylesheet" href="css/style.css?v=20261121d">
</head>
<body>
  <header class="masthead">
    <a class="title" href="index.html" id="brandTitle">Learning Desk</a>
    <div class="cells">
      <span class="cell"><span class="crumbs"><a href="index.html">Dashboard</a><span class="sep">&rsaquo;</span><span id="crumbModule">Module</span><span class="sep">&rsaquo;</span>Test</span></span>
      <span class="cell" id="answeredCell" aria-hidden="true"></span>
    </div>
  </header>

  <div class="page">
    <div class="narrow">
      <div id="message" class="message hidden" role="alert" aria-live="assertive" style="margin-top:18px"></div>
      <p id="loading" class="loading">Preparing your test...</p>

      <!-- ===================== Questions ===================== -->
      <section id="testView" class="hidden">
        <header class="test-head">
          <div class="row label"><span id="modLabel">Module</span><span id="countLabel"></span></div>
          <h1 id="testTitle"></h1>
          <p>Choose one answer for each question, then submit.</p>
        </header>

        <form id="testForm" class="questions"></form>

        <div class="submit-bar">
          <div class="row">
            <span class="label" id="answeredCount" aria-live="polite"></span>
          </div>
          <div class="segments" id="segments" aria-hidden="true"></div>
          <p class="hint" id="submitHint"></p>
          <button type="button" class="btn full" id="submitBtn" disabled>Submit</button>
        </div>
      </section>

      <!-- ===================== Result ===================== -->
      <section id="resultView" class="result hidden">
        <div class="card" id="resultCard">
          <div class="card-top label"><span id="resultTag"></span><span id="attemptTag"></span></div>
          <h1 class="big-num" id="score"></h1>
          <p class="label" id="scoreDetail"></p>
          <p class="verdict" id="verdict"></p>
          <div class="actions" id="resultActions"></div>
        </div>

        <div class="review">
          <div class="group-head" style="margin:20px 0 4px"><h2>Review</h2><span class="label muted" id="reviewCount"></span></div>
          <div id="review"></div>
        </div>
        <div class="actions" id="resultActionsBottom"></div>
      </section>
    </div>
  </div>

  <!-- Confirmation dialog -->
  <div class="overlay hidden" id="confirmBox" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmText">
    <div class="dialog">
      <h2 id="confirmTitle">Submit your answers?</h2>
      <p class="muted small" id="confirmText">You cannot change them after submitting.</p>
      <div class="actions">
        <button type="button" class="btn outline" id="cancelBtn">Cancel</button>
        <button type="button" class="btn" id="confirmBtn">Submit</button>
      </div>
    </div>
  </div>

  <script src="js/config.js?v=20261121d"></script>
  <script src="js/mock.js?v=20261121d"></script>
  <script src="js/api.js?v=20261121d"></script>
  <script src="js/app.js?v=20261121d"></script>
  <script>
    (async function () {
      if (!App.requireLogin()) return;
      var $ = function (id) { return document.getElementById(id); };
      var pad = function (n) { return (n < 10 ? "0" : "") + n; };
      var moduleId = Number(App.param("id"));
      var submitted = false;

      var manifest = await App.loadManifest();
      $("brandTitle").textContent = manifest.siteTitle || "Learning Desk";
      var mod = manifest.modules.find(function (m) { return m.id === moduleId; });
      var modTitle = mod ? mod.title : "Module " + moduleId;
      document.title = "Test: Module " + moduleId;
      $("crumbModule").textContent = "Module " + pad(moduleId);
      $("modLabel").textContent = "Module " + pad(moduleId) + " test";

      // Ask the server for a new set of questions. It checks the module is
      // unlocked and has been read. No answers are sent to the browser here.
      var test = await Api.call("startTest", { moduleId: moduleId });
      $("loading").classList.add("hidden");
      if (!test.ok) {
        App.showMessage(test.error, true);
        if (test.code === "NOT_READ") {
          $("message").insertAdjacentHTML("beforeend", " <a href='module.html?id=" + moduleId + "'>Go to the module</a>");
        }
        return;
      }

      // ---------- Show the questions ----------
      var total = test.questions.length;
      $("testTitle").textContent = modTitle;
      $("countLabel").textContent = total + " questions";
      var form = $("testForm");
      test.questions.forEach(function (q, i) {
        var fs = document.createElement("fieldset");
        fs.className = "question";
        fs.id = "q-" + i;
        var html = "<legend><span class='label'>Question " + pad(i + 1) + "</span>" + App.escapeHtml(q.question) + "</legend>";
        q.options.forEach(function (o) {
          html += "<label class='option'><input type='radio' name='" + App.escapeHtml(q.questionId) + "' value='" + o.key + "'><span>" + App.escapeHtml(o.text) + "</span></label>";
        });
        fs.innerHTML = html;
        form.appendChild(fs);
      });
      $("testView").classList.remove("hidden");

      function collectAnswers() {
        var answers = {};
        test.questions.forEach(function (q) {
          var checked = form.querySelector("input[name='" + CSS.escape(q.questionId) + "']:checked");
          if (checked) answers[q.questionId] = checked.value;
        });
        return answers;
      }

      function update() {
        var answers = collectAnswers();
        var missing = [];
        test.questions.forEach(function (q, i) {
          var done = !!answers[q.questionId];
          $("q-" + i).classList.toggle("answered", done);
          if (!done) missing.push(i + 1);
        });
        form.querySelectorAll(".option").forEach(function (l) {
          l.classList.toggle("checked", l.querySelector("input").checked);
        });
        var n = total - missing.length;
        $("answeredCount").textContent = n + " of " + total + " answered";
        $("answeredCell").textContent = pad(n) + " / " + pad(total);
        $("segments").innerHTML = test.questions.map(function (q) {
          return "<span class='seg" + (answers[q.questionId] ? " on" : "") + "'></span>";
        }).join("");
        $("submitBtn").disabled = missing.length > 0;
        $("submitHint").textContent = missing.length === 0
          ? "All questions answered."
          : "Not answered yet: " + missing.map(function (m) { return "Q" + pad(m); }).join(", ") + ".";
      }
      form.addEventListener("change", update);
      update();

      // Warn before leaving the page with answers that were not submitted.
      window.addEventListener("beforeunload", function (e) {
        if (!submitted && Object.keys(collectAnswers()).length > 0) { e.preventDefault(); e.returnValue = ""; }
      });

      // ---------- Confirmation dialog ----------
      var box = $("confirmBox");
      function openDialog() { box.classList.remove("hidden"); $("cancelBtn").focus(); }
      function closeDialog() { box.classList.add("hidden"); $("submitBtn").focus(); }
      $("submitBtn").addEventListener("click", openDialog);
      $("cancelBtn").addEventListener("click", closeDialog);
      box.addEventListener("click", function (e) { if (e.target === box) closeDialog(); });
      box.addEventListener("keydown", function (e) {
        if (e.key === "Escape") { closeDialog(); return; }
        if (e.key === "Tab") {
          // Keep keyboard focus inside the dialog.
          var first = $("cancelBtn"), last = $("confirmBtn");
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      });

      $("confirmBtn").addEventListener("click", async function () {
        var btn = $("confirmBtn");
        btn.disabled = true;
        btn.textContent = "Submitting...";
        var r = await Api.call("submitTest", { attemptId: test.attemptId, answers: collectAnswers() });
        box.classList.add("hidden");
        if (!r.ok) {
          btn.disabled = false;
          btn.textContent = "Submit";
          App.showMessage(r.error, true);
          window.scrollTo(0, 0);
          return;
        }
        submitted = true;
        showResult(r);
      });

      // ---------- Result ----------
      function showResult(r) {
        // After a fail the whole module has to be read again from section 1.
        if (!r.passed) App.resetReadState(moduleId);

        $("testView").classList.add("hidden");
        $("message").classList.add("hidden");
        $("answeredCell").textContent = r.passed ? "Passed" : "Not passed";
        $("resultCard").className = "card " + (r.passed ? "green" : "blue-200");
        $("resultTag").textContent = r.passed ? "Passed" : "Not passed";
        $("attemptTag").textContent = "Attempt " + r.attemptNumber;
        $("score").textContent = r.scorePct + "%";
        $("scoreDetail").textContent = r.correct + " of " + r.total + " correct";
        $("verdict").innerHTML = r.passed
          ? "Passed. <em>The next module is now open.</em>"
          : "Not passed. <em>Read the module again and retake the test.</em>";

        var buttons = "<a class='btn' href='index.html'>Back to dashboard</a>";
        if (!r.passed) buttons += "<a class='btn outline' href='module.html?id=" + moduleId + "'>Read module again</a>";
        $("resultActions").innerHTML = buttons;
        $("resultActionsBottom").innerHTML = buttons;

        var wrong = r.review.filter(function (q) { return !q.isCorrect; }).length;
        $("reviewCount").textContent = wrong ? wrong + " wrong" : "All correct";
        $("review").innerHTML = r.review.map(function (q, i) {
          return "<div class='review-item'>" +
            "<div class='top label'><span>Question " + pad(i + 1) + "</span>" +
            (q.isCorrect ? "<span class='mark-ok'>&#10003; Correct</span>" : "<span>&#10007; Wrong</span>") + "</div>" +
            "<p class='q'>" + App.escapeHtml(q.question) + "</p>" +
            "<dl><dt class='label'>Your answer</dt><dd>" + App.escapeHtml(q.yourAnswer) + "</dd>" +
            "<dt class='label'>Correct</dt><dd>" + App.escapeHtml(q.correctAnswer) + "</dd></dl>" +
            (q.explanation ? "<p class='why'>" + App.escapeHtml(q.explanation) + "</p>" : "") +
            "</div>";
        }).join("");

        $("resultView").classList.remove("hidden");
        window.scrollTo(0, 0);
      }
    })();
  </script>
</body>
</html>
