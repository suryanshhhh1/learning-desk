<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <a class="brand" href="index.html"><span class="mark" aria-hidden="true"></span><span class="mono">NABH Onboarding</span></a>
      <div class="topbar-right">
        <a class="btn small light" href="index.html">Dashboard</a>
      </div>
    </header>

    <div class="reading">
      <div id="message" class="message hidden" role="alert" aria-live="assertive"></div>
      <p id="loading" class="loading">Preparing your test</p>

      <!-- ===================== Questions ===================== -->
      <section id="testView" class="hidden">
        <header class="test-head">
          <div class="row"><span class="pill dark" id="modPill">Module</span><span class="pill" id="countPill"></span></div>
          <div class="dots dot-xl" data-dots="TEST." aria-hidden="true"></div>
          <h1 class="lede"><span id="testTitle"></span> <span class="tone">Choose one answer for each question.</span></h1>
        </header>

        <form id="testForm"></form>

        <div class="panel submit-bar">
          <div class="row">
            <span class="mono" id="answeredCount" aria-live="polite"></span>
            <span class="mono muted" id="passNote"></span>
          </div>
          <div class="segments" id="segments" aria-hidden="true"></div>
          <p class="hint" id="submitHint"></p>
          <button type="button" class="btn full has-ico" id="submitBtn" disabled><span class="ico" aria-hidden="true"></span><span>Submit</span></button>
        </div>
      </section>

      <!-- ===================== Result ===================== -->
      <section id="resultView" class="hidden">
        <div class="panel result-head">
          <div class="row" style="display:flex;gap:8px;flex-wrap:wrap">
            <span class="pill dark" id="resultPill"></span><span class="pill" id="attemptPill"></span>
          </div>
          <h1 class="visually-hidden" id="scoreText"></h1>
          <div class="dots dot-xl" id="score" aria-hidden="true"></div>
          <p class="mono muted" id="scoreDetail"></p>
          <p class="result-line" id="resultLine"></p>
          <div class="actions" id="resultActions"></div>
        </div>

        <h2 class="pill review-head">Review</h2>
        <div id="review"></div>
        <div class="actions" id="resultActionsBottom"></div>
      </section>
    </div>
  </div>

  <!-- Confirmation dialog -->
  <div class="overlay hidden" id="confirmBox" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmText">
    <div class="panel dialog">
      <p id="confirmTitle"><strong>Submit your answers?</strong></p>
      <p class="muted small" id="confirmText">You cannot change them after submitting.</p>
      <div class="actions">
        <button type="button" class="btn light" id="cancelBtn">Cancel</button>
        <button type="button" class="btn" id="confirmBtn">Submit</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dots.js"></script>
  <script>
    (async function () {
      if (!App.requireLogin()) return;
      var $ = function (id) { return document.getElementById(id); };
      var pad = function (n) { return (n < 10 ? "0" : "") + n; };
      var moduleId = Number(App.param("id"));
      var submitted = false;

      var manifest = await App.loadManifest();
      var mod = manifest.modules.find(function (m) { return m.id === moduleId; });
      var modTitle = mod ? mod.title : "Module " + moduleId;
      document.title = "Test: Module " + moduleId;
      $("modPill").textContent = "Module " + pad(moduleId);

      // Ask the server for a new set of questions. It checks the module is
      // unlocked and has been read. No answers are sent to the browser here.
      var test = await Api.call("startTest", { moduleId: moduleId });
      $("loading").classList.add("hidden");
      if (!test.ok) {
        App.showMessage(test.error, true);
        if (test.code === "NOT_READ") {
          $("message").insertAdjacentHTML("beforeend", " <a href='module.html?id=" + moduleId + "'>Go to the module</a>");
        }
        return;
      }

      // ---------- Show the questions ----------
      var total = test.questions.length;
      $("testTitle").textContent = modTitle + ".";
      $("countPill").textContent = total + " questions";
      var form = $("testForm");
      test.questions.forEach(function (q, i) {
        var fs = document.createElement("fieldset");
        fs.className = "panel question";
        fs.id = "q-" + i;
        var html = "<legend><span class='pill'>Q" + pad(i + 1) + "</span>" + App.escapeHtml(q.question) + "</legend>";
        q.options.forEach(function (o) {
          html += "<label class='option'><input type='radio' name='" + App.escapeHtml(q.questionId) + "' value='" + o.key + "'><span>" + App.escapeHtml(o.text) + "</span></label>";
        });
        fs.innerHTML = html;
        form.appendChild(fs);
      });
      $("testView").classList.remove("hidden");
      DotText.renderAll();

      function collectAnswers() {
        var answers = {};
        test.questions.forEach(function (q) {
          var checked = form.querySelector("input[name='" + CSS.escape(q.questionId) + "']:checked");
          if (checked) answers[q.questionId] = checked.value;
        });
        return answers;
      }

      function update() {
        var answers = collectAnswers();
        var missing = [];
        test.questions.forEach(function (q, i) {
          var done = !!answers[q.questionId];
          $("q-" + i).classList.toggle("answered", done);
          if (!done) missing.push(i + 1);
        });
        // Mark the chosen option (works in browsers without :has()).
        form.querySelectorAll(".option").forEach(function (l) {
          l.classList.toggle("checked", l.querySelector("input").checked);
        });
        var n = total - missing.length;
        $("answeredCount").textContent = n + " of " + total + " answered";
        $("segments").innerHTML = test.questions.map(function (q) {
          return "<span class='seg" + (answers[q.questionId] ? " on" : "") + "'></span>";
        }).join("");
        $("submitBtn").disabled = missing.length > 0;
        $("submitHint").textContent = missing.length === 0
          ? "All questions answered."
          : "Not answered yet: " + missing.map(function (m) { return "Q" + pad(m); }).join(", ") + ".";
      }
      form.addEventListener("change", update);
      update();

      // Warn before leaving the page with answers that were not submitted.
      window.addEventListener("beforeunload", function (e) {
        if (!submitted && Object.keys(collectAnswers()).length > 0) { e.preventDefault(); e.returnValue = ""; }
      });

      // ---------- Confirmation dialog ----------
      var box = $("confirmBox");
      function openDialog() {
        box.classList.remove("hidden");
        $("cancelBtn").focus();
      }
      function closeDialog() {
        box.classList.add("hidden");
        $("submitBtn").focus();
      }
      $("submitBtn").addEventListener("click", openDialog);
      $("cancelBtn").addEventListener("click", closeDialog);
      box.addEventListener("click", function (e) { if (e.target === box) closeDialog(); });
      box.addEventListener("keydown", function (e) {
        if (e.key === "Escape") { closeDialog(); return; }
        if (e.key === "Tab") {
          // Keep keyboard focus inside the dialog.
          var first = $("cancelBtn"), last = $("confirmBtn");
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      });

      $("confirmBtn").addEventListener("click", async function () {
        var btn = $("confirmBtn");
        btn.disabled = true;
        btn.textContent = "Submitting";
        var r = await Api.call("submitTest", { attemptId: test.attemptId, answers: collectAnswers() });
        box.classList.add("hidden");
        if (!r.ok) {
          btn.disabled = false;
          btn.textContent = "Submit";
          App.showMessage(r.error, true);
          window.scrollTo(0, 0);
          return;
        }
        submitted = true;
        showResult(r);
      });

      // ---------- Result ----------
      function showResult(r) {
        // After a fail the whole module has to be read again from section 1.
        if (!r.passed) App.resetReadState(moduleId);

        $("testView").classList.add("hidden");
        $("message").classList.add("hidden");
        $("resultPill").textContent = r.passed ? "Passed" : "Not passed";
        $("attemptPill").textContent = "Module " + pad(moduleId) + " / Attempt " + r.attemptNumber;
        $("scoreText").textContent = "Score " + r.scorePct + "%";
        $("scoreDetail").textContent = r.correct + " of " + r.total + " correct";
        $("resultLine").innerHTML = r.passed
          ? "Passed. <span class='tone'>The next module is now open.</span>"
          : "Not passed. <span class='tone'>Read the module again and retake the test.</span>";

        var buttons = "<a class='btn has-ico' href='index.html'><span class='ico' aria-hidden='true'></span><span>Back to dashboard</span></a>";
        if (!r.passed) buttons += "<a class='btn light' href='module.html?id=" + moduleId + "'>Read module again</a>";
        $("resultActions").innerHTML = buttons;
        $("resultActionsBottom").innerHTML = buttons;

        $("review").innerHTML = r.review.map(function (q, i) {
          return "<div class='panel review-item'>" +
            "<div class='top'><span class='pill'>Q" + pad(i + 1) + "</span><span class='pill" + (q.isCorrect ? " dark'>&#10003; Correct" : "'>&#10007; Wrong") + "</span></div>" +
            "<p class='q'>" + App.escapeHtml(q.question) + "</p>" +
            "<dl><dt>Your answer</dt><dd>" + App.escapeHtml(q.yourAnswer) + "</dd>" +
            "<dt>Correct</dt><dd>" + App.escapeHtml(q.correctAnswer) + "</dd></dl>" +
            (q.explanation ? "<p class='why'>" + App.escapeHtml(q.explanation) + "</p>" : "") +
            "</div>";
        }).join("");

        $("resultView").classList.remove("hidden");
        DotText.render($("score"), r.scorePct + "%");
        window.scrollTo(0, 0);
      }
    })();
  </script>
</body>
</html>
