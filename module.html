<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Module</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="masthead">
    <a class="title" href="index.html">NABH Onboarding</a>
    <div class="cells">
      <span class="cell"><span class="crumbs"><a href="index.html">Dashboard</a><span class="sep">&rsaquo;</span><span id="crumbModule">Module</span></span></span>
      <span class="cell" id="counterCell" aria-live="polite"></span>
    </div>
  </header>

  <div id="message" class="message hidden narrow" role="alert" aria-live="assertive" style="margin-top:18px"></div>
  <p id="loading" class="loading narrow">Loading...</p>

  <div id="readerView" class="reader-layout hidden">
    <aside class="side" aria-label="Sections">
      <div class="side-head">
        <span class="label muted" id="modLabel">Module</span>
        <h1 id="moduleTitle"></h1>
        <div class="segments" id="segments" aria-hidden="true"></div>
      </div>
      <ol class="toc" id="toc"></ol>
    </aside>

    <main class="main-col">
      <article class="reader">
        <span class="label kicker" id="kicker"></span>
        <h2 id="sectionHeading" tabindex="-1"></h2>
        <div id="sectionBody"></div>
      </article>

      <nav class="nav-row" aria-label="Section navigation">
        <button type="button" class="btn outline" id="backBtn">Back</button>
        <button type="button" class="btn" id="nextBtn">Next</button>
      </nav>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="lib/marked.min.js"></script>
  <script>
    (async function () {
      if (!App.requireLogin()) return;
      var $ = function (id) { return document.getElementById(id); };
      var pad = function (n) { return (n < 10 ? "0" : "") + n; };
      var moduleId = Number(App.param("id"));

      function fail(text) {
        $("loading").classList.add("hidden");
        App.showMessage(text, true);
      }

      // Load the module list and the user's progress together.
      var results = await Promise.all([App.loadManifest(), Api.call("getProgress")]);
      var manifest = results[0];
      var res = results[1];
      if (!res.ok) return fail(res.error);

      var item = App.moduleStatuses(manifest.modules, res.progress).find(function (i) { return i.module.id === moduleId; });
      if (!item) return fail("This module does not exist.");
      if (item.status === "comingSoon") return fail("This module has not been published yet.");
      if (item.status === "locked") return fail("This module is locked. Pass the previous module first.");

      // Load and split the markdown file.
      var mdRes = await fetch("content/" + item.module.file, { cache: "no-cache" });
      if (!mdRes.ok) return fail("Could not load the module text.");
      var doc = App.splitSections(await mdRes.text());
      var sections = doc.sections;
      document.title = doc.title || item.module.title;
      $("crumbModule").textContent = "Module " + pad(moduleId);
      $("modLabel").textContent = "Module " + pad(moduleId) + (item.module.part ? " / " + item.module.part : "");
      $("moduleTitle").textContent = item.module.title;

      // The wait applies only while the module is being read for the first
      // time (status "open"), and only on sections not yet seen.
      var minSeconds = Number(res.settings && res.settings.minSecondsPerSection) || 0;
      var useTimer = item.status === "open";
      var state = App.getReadState(moduleId);
      if (state.current >= sections.length) state.current = 0;

      var timer = null;
      var hasRendered = false;

      function lastLabel() {
        return item.status === "completed" ? "Back to dashboard" : "Take the test";
      }

      // A section can be opened from the list once it has been reached.
      function canJump(i) {
        return !useTimer || i <= state.maxSeen + 1;
      }

      function renderToc() {
        $("toc").innerHTML = sections.map(function (s, i) {
          return "<li class='" + (i === state.current ? "current" : "") + "'><button type='button' data-i='" + i + "'" +
            (canJump(i) ? "" : " disabled") + (i === state.current ? " aria-current='step'" : "") +
            "><span class='label'>" + pad(i + 1) + "</span><span>" + App.escapeHtml(s.heading) + "</span></button></li>";
        }).join("");
      }

      function render() {
        clearInterval(timer);
        var s = sections[state.current];
        var n = state.current + 1;
        var counter = "Section " + n + " of " + sections.length;

        $("counterCell").textContent = counter;
        $("kicker").textContent = counter;
        $("segments").innerHTML = sections.map(function (_, i) {
          return "<span class='seg" + (i < state.current ? " on" : i === state.current ? " current" : "") + "'></span>";
        }).join("");

        $("sectionHeading").textContent = s.heading;
        $("sectionBody").innerHTML = marked.parse(s.body);

        // Wrap every table so it can scroll sideways on a phone.
        $("sectionBody").querySelectorAll("table").forEach(function (t) {
          var w = document.createElement("div");
          w.className = "table-scroll";
          t.parentNode.insertBefore(w, t);
          w.appendChild(t);
        });

        $("backBtn").disabled = state.current === 0;
        var isLast = state.current === sections.length - 1;
        var label = isLast ? lastLabel() : "Next";
        var next = $("nextBtn");

        if (useTimer && state.current > state.maxSeen && minSeconds > 0) {
          var left = minSeconds;
          next.disabled = true;
          next.textContent = label + " (" + left + ")";
          timer = setInterval(function () {
            left--;
            if (left <= 0) {
              clearInterval(timer);
              state.maxSeen = Math.max(state.maxSeen, state.current);
              App.setReadState(moduleId, state);
              next.disabled = false;
              next.textContent = label;
              renderToc();
            } else {
              next.textContent = label + " (" + left + ")";
            }
          }, 1000);
        } else {
          next.disabled = false;
          next.textContent = label;
        }

        renderToc();
        App.setReadState(moduleId, state);
        window.scrollTo(0, 0);
        // Move focus to the new heading so screen readers start the new section.
        if (hasRendered) $("sectionHeading").focus({ preventScroll: true });
        hasRendered = true;
      }

      $("toc").addEventListener("click", function (e) {
        var b = e.target.closest("button[data-i]");
        if (!b || b.disabled) return;
        state.current = Number(b.dataset.i);
        render();
      });

      $("backBtn").addEventListener("click", function () {
        if (state.current > 0) { state.current--; render(); }
      });

      $("nextBtn").addEventListener("click", async function () {
        if (state.current < sections.length - 1) {
          state.current++;
          render();
          return;
        }
        // Last screen.
        if (item.status === "completed") { window.location.href = "index.html"; return; }
        var btn = $("nextBtn");
        btn.disabled = true;
        btn.textContent = "Please wait...";
        var r = await Api.call("markReadComplete", { moduleId: moduleId });
        if (!r.ok) { App.showMessage(r.error, true); btn.disabled = false; btn.textContent = lastLabel(); return; }
        window.location.href = "test.html?id=" + moduleId;
      });

      $("loading").classList.add("hidden");
      $("readerView").classList.remove("hidden");
      render();
    })();
  </script>
</body>
</html>
